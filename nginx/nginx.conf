# ─────────────────────────────────────────────────────────────────────────────
# nginx/nginx.conf  —  Main reverse proxy for AISchoolonair on Hetzner
#
# Traffic flow:
#   Internet → nginx:80/443
#     /api/*        → server container (Node.js :5000)
#     /socket.io/*  → server container (WebSocket upgrade)
#     /uploads/*    → files served directly from Docker volume (no Node overhead)
#     /*            → client container (React SPA, nginx:80 inside)
#
# SSL is managed by Certbot. After running certbot, it will modify this file
# automatically to add SSL directives. Keep the HTTP→HTTPS redirect block below.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Max upload size (videos can be large)
    client_max_body_size 250M;

    # Upstream services (Docker internal DNS resolves these by service name)
    upstream backend {
        server server:5000;
    }
    upstream frontend {
        server client:80;
    }

    # ── HTTP server — redirects everything to HTTPS ──────────────────────────
    # (Certbot will fill in the HTTPS server block below automatically)
    server {
        listen 80;
        listen [::]:80;

        # ⚠️  Replace with your actual domain
        server_name aischoolonair.com www.aischoolonair.com;

        # Certbot ACME challenge (needed for SSL certificate issuance)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    # Certbot populates the ssl_certificate paths.
    # Until you run certbot, comment out this entire server block and use
    # only the HTTP block above (temporarily without the redirect).
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        # ⚠️  Replace with your actual domain
        server_name aischoolonair.com www.aischoolonair.com;

        # SSL — Certbot manages these paths
        ssl_certificate     /etc/letsencrypt/live/aischoolonair.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aischoolonair.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # ── API requests → Node.js backend ───────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts (AI generation can take a while)
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── WebSocket (Socket.io realtime) → Node.js backend ─────────────────
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # ── Uploaded files served directly from volume ────────────────────────
        # No Node.js overhead for file downloads — nginx reads them directly.
        location /uploads/ {
            alias   /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff;
        }

        # ── Everything else → React SPA ───────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
