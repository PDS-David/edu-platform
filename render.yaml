services:
  # ── Backend: Node/Express API ─────────────────────────────────────────────
  - type: web
    name: AISchoolonair-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      # Auto-injected from the Render PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: AISchoolonair-db
          property: connectionString

      # Set these manually in the Render dashboard → AISchoolonair-api → Environment
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_LOGGING
        value: false

      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite

      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Set CLIENT_URL to your frontend Render URL after first deploy
      # e.g. https://AISchoolonair-frontend.onrender.com
      - key: CLIENT_URL
        sync: false
      - key: PROD_CLIENT_URL
        sync: false

      # Set to your backend's own Render URL after first deploy
      # e.g. https://AISchoolonair-api.onrender.com
      - key: SERVER_BASE_URL
        sync: false

      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 1000

      # Redis: leave blank on free tier (no Redis on Render free plan)
      - key: REDIS_URL
        value: ""

      - key: ADMIN_WHITELIST_IPS
        value: ""

  # ── Frontend: React/Vite Static Site ──────────────────────────────────────
  - type: web
    name: AISchoolonair-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        value: https://aischoolonair-api.onrender.com

    routes:
      # Send all routes to index.html so React Router works correctly
      - type: rewrite
        source: /*
        destination: /index.html

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: AISchoolonair-db
    plan: free
    databaseName: edu_platform
    user: eduuser
