# ─────────────────────────────────────────────────────────────────────────────
# AISchoolonair — Hetzner Production Stack (Architecture B)
#
# Services:
#   caddy  — Reverse proxy + automatic Let's Encrypt SSL (ports 80+443)
#   api    — Node/Express backend (internal, port 5000)
#   web    — React SPA served by nginx (internal, port 80)
#   redis  — Session / rate-limit cache (internal)
#
# Database: Render-managed Postgres (external) — just point DATABASE_URL at it.
# Storage:  Cloudflare R2 (already wired — no local upload volume needed).
#
# Usage:
#   cp api.env.example api.env   # fill in all values
#   docker compose pull && docker compose up -d
#   docker compose logs -f
# ─────────────────────────────────────────────────────────────────────────────

services:

  caddy:
    image: caddy:2-alpine
    container_name: aischool_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [api, web]

  api:
    image: ghcr.io/pds-david/edu-platform-api:latest
    container_name: aischool_api
    restart: unless-stopped
    env_file: ./api.env
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  web:
    image: ghcr.io/pds-david/edu-platform-web:latest
    container_name: aischool_web
    restart: unless-stopped
    networks: [web]

  redis:
    image: redis:7-alpine
    container_name: aischool_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes: [redisdata:/data]
    networks: [web]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redisdata:

networks:
  web:
    driver: bridge
