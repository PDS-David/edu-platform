# ─────────────────────────────────────────────────────────────────────────────
# Continuous Deployment — triggers on push to main
# SSHs into Hetzner server and runs production deploy script
#
# Required GitHub Secrets:
#   DEPLOY_HOST   → 178.104.51.118
#   DEPLOY_USER   → deploy (recommended) or root
#   DEPLOY_KEY    → private SSH key (github_actions_key)
#   DEPLOY_PATH   → /home/deploy/edu-platform
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Production

# Root cause of the 5a65d73 double-deploy incident (run #626 vs #627,
# both created at the same second, both genuine 'push' events -- not a
# manual re-run, which would show as a second *attempt* on one run id,
# not two separate run ids): GitHub delivered a duplicate webhook for a
# single push, firing two independent runs with no guard between them.
# Both SSHed into the same production server and ran `docker compose up`
# in overlapping windows; Compose's recreate cycle for aischool_api was
# mid-rename in one process exactly when the other tried to claim that
# same container name, so Docker's daemon rejected it:
#   "Error when allocating new name: Conflict. The container name
#    /aischool_api is already in use by container ..."
#   Process exited with status 1.
# The `concurrency` block below fixes the actual constraint that was
# missing: at most one deploy against this production server at a time,
# regardless of how many push/workflow_dispatch events land close
# together. cancel-in-progress is deliberately false -- killing a deploy
# mid `docker compose up` would risk leaving containers in a half
# recreated state, which is worse than the queued run just waiting a
# minute for the first one to finish cleanly.
concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code (for reference only)
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          # 'timeout' below is the SSH CONNECTION dial timeout (time to
          # establish the connection itself) — it does NOT limit how long the
          # remote script is allowed to run. That is controlled by
          # command_timeout, which was never set here and therefore silently
          # defaulted to appleboy/ssh-action's default of 600s (10 min).
          # A previous fix (febab6d1) correctly diagnosed that builds were
          # exceeding a 10-minute limit and getting killed mid-build (with
          # the job still reporting ✓ success, since the SSH layer treats a
          # command-timeout kill differently from a connection failure) —
          # but it bumped 'timeout' (600s→1200s), the wrong parameter.
          # command_timeout remained at the unchanged 600s default the whole
          # time, so the actual constraint never moved. This is why
          # "React is not defined" kept recurring even after that fix:
          # any deploy whose build took >10 min (cache miss, or contention
          # from the concurrent staging stack on the same VPS) was silently
          # truncated mid-build, leaving the old container running while
          # GitHub Actions still showed a green check.
          timeout: 60s
          command_timeout: 1800s

          script: |
            set -e

            echo "════════════════════════════════════"
            echo "🚀 AISchoolonair Deployment Started"
            echo "════════════════════════════════════"

            cd /opt/aischoolonair

            echo "▶ Cleaning up stale Git lock files..."
            find .git/refs -name "*.lock" -delete 2>/dev/null || true
            find .git -name "*.lock" -delete 2>/dev/null || true

            echo "▶ Fixing Git directory ownership (recovery guard)..."
            # chmod below only fixes permission bits — it can't fix an
            # owner mismatch. If anything (a manual root login, a stray
            # root-owned process, etc.) ever leaves .git owned by a
            # different user than DEPLOY_USER, git's own safety check
            # ("detected dubious ownership in repository") refuses to
            # touch the repo at all, and chmod alone won't clear that.
            # This has already been hit and fixed by hand on the server
            # once; folding it in here means the next occurrence recovers
            # automatically instead of needing another manual fix.
            chown -R "$(id -u):$(id -g)" .git 2>/dev/null || true

            echo "▶ Fixing Git directory permissions..."
            chmod -R u+w .git 2>/dev/null || true

            echo "▶ Syncing with GitHub (hard reset safe mode)..."
            git fetch origin
            git reset --hard origin/main

            echo "▶ Ensuring caddy is running (recovery guard)..."
            docker compose up -d caddy redis || true

            echo "▶ Running deployment script..."
            bash deploy.sh

            echo "════════════════════════════════════"
            echo "✅ Deployment successful"
            echo "════════════════════════════════════"
