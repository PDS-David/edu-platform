# ─────────────────────────────────────────────────────────────────────────────
# Continuous Deployment — triggers on push to main
# SSHs into Hetzner server and runs production deploy script
#
# Required GitHub Secrets:
#   DEPLOY_HOST   → 178.104.51.118
#   DEPLOY_USER   → deploy (recommended) or root
#   DEPLOY_KEY    → private SSH key (github_actions_key)
#   DEPLOY_PATH   → /home/deploy/edu-platform
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code (for reference only)
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          # 'timeout' below is the SSH CONNECTION dial timeout (time to
          # establish the connection itself) — it does NOT limit how long the
          # remote script is allowed to run. That is controlled by
          # command_timeout, which was never set here and therefore silently
          # defaulted to appleboy/ssh-action's default of 600s (10 min).
          # A previous fix (febab6d1) correctly diagnosed that builds were
          # exceeding a 10-minute limit and getting killed mid-build (with
          # the job still reporting ✓ success, since the SSH layer treats a
          # command-timeout kill differently from a connection failure) —
          # but it bumped 'timeout' (600s→1200s), the wrong parameter.
          # command_timeout remained at the unchanged 600s default the whole
          # time, so the actual constraint never moved. This is why
          # "React is not defined" kept recurring even after that fix:
          # any deploy whose build took >10 min (cache miss, or contention
          # from the concurrent staging stack on the same VPS) was silently
          # truncated mid-build, leaving the old container running while
          # GitHub Actions still showed a green check.
          timeout: 60s
          command_timeout: 1800s

          script: |
            set -e

            echo "════════════════════════════════════"
            echo "🚀 AISchoolonair Deployment Started"
            echo "════════════════════════════════════"

            cd /opt/aischoolonair

            echo "▶ Cleaning up stale Git lock files..."
            find .git/refs -name "*.lock" -delete 2>/dev/null || true
            find .git -name "*.lock" -delete 2>/dev/null || true

            echo "▶ Fixing Git directory permissions..."
            chmod -R u+w .git 2>/dev/null || true

            echo "▶ Syncing with GitHub (hard reset safe mode)..."
            git fetch origin
            git reset --hard origin/main

            echo "▶ Ensuring caddy is running (recovery guard)..."
            docker compose up -d caddy redis || true

            echo "▶ Running deployment script..."
            bash deploy.sh

            echo "════════════════════════════════════"
            echo "✅ Deployment successful"
            echo "════════════════════════════════════"
