name: Deploy to Staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  staging:
    name: SSH Deploy → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          command_timeout: 12m
          script: |
            set -e
            cd /opt/aischoolonair
            git fetch origin
            # Check out PR branch on server for staging build
            BRANCH="${{ github.head_ref }}"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" origin/"$BRANCH"
            git pull origin "$BRANCH"
            docker compose build api_staging web_staging
            docker compose up -d --no-deps --force-recreate api_staging web_staging
            echo "✅ Staging deploy complete — https://staging.aischoolonair.ng"
