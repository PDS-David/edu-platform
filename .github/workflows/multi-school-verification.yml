name: Multi-school verification

on:
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - 'database/migration_036_teacher_school_subject_scope.sql'
      - '.github/workflows/multi-school-verification.yml'
  push:
    branches:
      - 'feature/multi-school-teacher-memberships-v2'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check modified server JavaScript
        working-directory: server
        run: |
          set -e
          for f in             middleware/auth.js             middleware/teacherOwnership.js             middleware/teacherScope.js             controllers/auth.js             routes/notesRoutes.js             routes/pastPaperRoutes.js             routes/resourceRoutes.js             routes/schoolRoutes.js             routes/subtopicRoutes.js             routes/syllabusRoutes.js             routes/teacherRoutes.js             routes/topicsRoutes.js             services/emailService.js
          do
            node --check "$f"
          done

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build client
        working-directory: client
        run: npm run build
