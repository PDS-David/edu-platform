# nginx-spa.conf
# Serves the built React SPA and proxies /api → backend service.
# This config lives INSIDE the client Docker container.
# The main reverse-proxy (nginx service in docker-compose) handles TLS, 
# upload proxying, and gzip BEFORE requests reach this container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html should never be cached so new deployments are picked up
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check endpoint for Docker HEALTHCHECK
    location = /health.txt {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # All other routes → React SPA (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
