# nginx-spa.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets: cache aggressively.
    # Vite gives every JS/CSS file a content-hash filename — when the file
    # changes, the name changes, so immutable caching is always safe here.
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check endpoint (must come before the SPA catch-all)
    location = /health.txt {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # All HTML responses (index.html directly, or served as SPA fallback):
    # - Never cache index.html. A stale index.html references old chunk filenames
    #   from a previous build, causing "React is not defined" on next load.
    # - Clear-Site-Data: "cache" tells the browser to purge ALL previously cached
    #   JS/CSS files on every full page navigation. This is the safety net that
    #   handles users who already have old chunks cached in their browser.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Clear-Site-Data '"cache"' always;
        try_files /index.html =404;
    }

    # SPA catch-all: any path that doesn't match a real file serves index.html.
    # Apply the same no-cache headers so React Router deep links also clear cache.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Clear-Site-Data '"cache"' always;
        try_files $uri $uri/ /index.html;
    }
}
