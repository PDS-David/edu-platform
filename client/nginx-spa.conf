# nginx-spa.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets: cache aggressively.
    # Vite gives every JS/CSS file a content-hash filename.
    # When the file changes, the name changes — immutable caching is always safe.
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check
    location = /health.txt {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # index.html — never cache, always clear stale JS/CSS chunks.
    # Clear-Site-Data tells the browser to discard ALL cached resources
    # from this origin so it fetches the new chunk filenames on next load.
    # Safe here because this block only matches the exact HTML file,
    # never JS/CSS (those match the block above, which is more specific).
    location = /index.html {
        add_header Cache-Control    "no-store, no-cache, must-revalidate" always;
        add_header Pragma           "no-cache"                            always;
        add_header Clear-Site-Data  '"cache"'                             always;
        try_files /index.html =404;
    }

    # SPA catch-all — serves index.html for every React Router path.
    # Also sends Clear-Site-Data so users entering via /teacher/resources
    # or any deep link also get their stale chunks cleared.
    # JS/CSS requests never reach this block (matched by the regex above).
    location / {
        add_header Cache-Control    "no-store, no-cache, must-revalidate" always;
        add_header Pragma           "no-cache"                            always;
        add_header Clear-Site-Data  '"cache"'                             always;
        try_files $uri $uri/ /index.html;
    }
}
