# nginx-spa.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets: cache aggressively.
    # A changed file always gets a new hash-based filename, so immutable is safe.
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html: never cache.
    # Clear-Site-Data: "cache" tells the browser to discard ALL previously
    # cached JS/CSS on every fresh page load. This prevents stale chunk files
    # from a previous deployment (e.g. vendor-react-*.js split chunks) from
    # being loaded against a new index.html that no longer references them —
    # which caused "ReferenceError: React is not defined" in production.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Clear-Site-Data '"cache"';
    }

    # Health check
    location = /health.txt {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # All other routes → React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
