# nginx-spa.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets: cache aggressively.
    # Vite gives every JS/CSS file a content-hash filename.
    # When the file changes, the name changes — immutable caching is always safe.
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check
    location = /health.txt {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # index.html — never cache.
    # Clear-Site-Data forces the browser to discard any cached JS/CSS files
    # from a previous build (e.g. old split-chunk filenames).
    # ONLY on exact /index.html — NOT on the catch-all — so JS/CSS assets
    # are not incorrectly told to purge themselves.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Clear-Site-Data '"cache"' always;
        try_files /index.html =404;
    }

    # SPA catch-all: serve index.html for all React Router paths.
    # No-cache only — NO Clear-Site-Data here (would be sent on JS/CSS requests
    # that fall through to this block if the file doesn't exist, wiping cache).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
