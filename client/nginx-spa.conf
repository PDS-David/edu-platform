# nginx-spa.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets: cache aggressively.
    # Vite gives every JS/CSS file a content-hash filename.
    # When the file changes, the name changes — immutable caching is always safe.
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check
    location = /health.txt {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # index.html — never cache, so a new deploy's chunk filenames are
    # always picked up on the next navigation.
    #
    # NOTE: this block used to also send Clear-Site-Data: "cache" on every
    # single page load/navigation as a workaround while tracking down a
    # "React is not defined" bug. That bug's actual root cause (a missing
    # React import in LandingPage.jsx) is now fixed — Clear-Site-Data is
    # removed because it was wiping the browser's entire cache for this
    # origin on every navigation, which defeated the immutable 1-year
    # asset caching configured above and produced a confusing browser
    # console message on every page load.
    location = /index.html {
        add_header Cache-Control    "no-store, no-cache, must-revalidate" always;
        add_header Pragma           "no-cache"                            always;
        try_files /index.html =404;
    }

    # SPA catch-all — serves index.html for every React Router path.
    # JS/CSS requests never reach this block (matched by the regex above).
    location / {
        add_header Cache-Control    "no-store, no-cache, must-revalidate" always;
        add_header Pragma           "no-cache"                            always;
        try_files $uri $uri/ /index.html;
    }
}
